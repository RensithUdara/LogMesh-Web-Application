services:
  api:
    build: .
    command: ["/logmesh-api"]
    environment:
      LOGMESH_ENV: development
      LOGMESH_HTTP_ADDR: :8081
      LOGMESH_LOG_LEVEL: info
      LOGMESH_MAX_STORED_LOGS: 10000
      LOGMESH_KAFKA_BROKERS: redpanda:9092
      LOGMESH_KAFKA_LOGS_TOPIC: logs
      LOGMESH_KAFKA_DLQ_TOPIC: logs-dlq
      LOGMESH_OPENSEARCH_URL: http://opensearch:9200
      LOGMESH_POSTGRES_URL: postgres://logmesh:logmesh@postgres:5432/logmesh?sslmode=disable
      LOGMESH_REDIS_URL: redis://redis:6379/0
    ports:
      - "8081:8081"
    depends_on:
      - redpanda
      - postgres
      - redis
      - opensearch

  processor:
    build: .
    command: ["/logmesh-processor"]
    environment:
      LOGMESH_ENV: development
      LOGMESH_LOG_LEVEL: info
      LOGMESH_KAFKA_BROKERS: redpanda:9092
      LOGMESH_KAFKA_LOGS_TOPIC: logs
      LOGMESH_KAFKA_DLQ_TOPIC: logs-dlq
      LOGMESH_OPENSEARCH_URL: http://opensearch:9200
      LOGMESH_PROCESSOR_WORKERS: 4
      LOGMESH_PROCESSOR_BATCH_SIZE: 500
      LOGMESH_PROCESSOR_BATCH_MS: 1000
    depends_on:
      - redpanda
      - opensearch

  redpanda:
    image: redpandadata/redpanda:v24.3.5
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logmesh
      POSTGRES_USER: logmesh
      POSTGRES_PASSWORD: logmesh
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: LogMeshDev123!
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: logmesh
    ports:
      - "3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
  opensearch-data:
