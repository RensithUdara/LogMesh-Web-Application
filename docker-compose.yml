services:
  api:
    build: .
    environment:
      LOGMESH_ENV: development
      LOGMESH_HTTP_ADDR: :8080
      LOGMESH_LOG_LEVEL: info
      LOGMESH_MAX_STORED_LOGS: 10000
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logmesh
      POSTGRES_USER: logmesh
      POSTGRES_PASSWORD: logmesh
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: LogMeshDev123!
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

volumes:
  postgres-data:
  opensearch-data:
